function win(){if(solved)return;solved=true;success();$('finishTitle').textContent=stage===specs.length-1?'ぜんぶ クリア！':'そろった！';$('finishNote').textContent=stage===specs.length-1?'8つの かげを みつけたね':'2つの かげが ぴったり';if(!specs[stage].both)$('finishNote').textContent='かげが ぴったり';$('next').textContent=stage===specs.length-1?'もういちど →':'つぎの かげ →';setTimeout(()=>{$('complete').classList.add('show')},235)}
scene.addEventListener('pointerdown',e=>{if(solved)return;e.preventDefault();soundInit();if(anim){liveQ=anim.to;anim=null}pointer=e.pointerId;mx=e.clientX;my=e.clientY;scene.setPointerCapture(pointer);hasMoved=true;$('instruction').classList.add('hidden')});
scene.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||solved)return;let dx=e.clientX-mx,dy=e.clientY-my;mx=e.clientX;my=e.clientY;if(Math.abs(dx)+Math.abs(dy)<.05)return;let divisor=clamp(hero.clientWidth*.28,85,135),qx=qaxis([1,0,0],-dy/divisor*Math.PI/2),qy=qaxis([0,1,0],dx/divisor*Math.PI/2);liveQ=qnorm(qmul(qx,qmul(qy,liveQ)));let closest=orientations.reduce((a,q,i)=>Math.abs(qdot(q,liveQ))>a.dot?{dot:Math.abs(qdot(q,liveQ)),i}:a,{dot:0,i:0});if(closest.i!==lastOrientation&&performance.now()-lastTick>70){lastOrientation=closest.i;lastTick=performance.now();tone(575+closest.i*6,.008,.026)}requestDraw()});
function release(e){if(pointer!==e.pointerId)return;pointer=null;let target=orientations.reduce((a,q,i)=>Math.abs(qdot(q,liveQ))>a.dot?{dot:Math.abs(qdot(q,liveQ)),i}:a,{dot:0,i:0});anim={from:liveQ.slice(),to:orientations[target.i],begin:performance.now(),duration:220};tone(690,.023,.075);requestDraw()}
scene.addEventListener('pointerup',release);scene.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{if(solved)return;const rot={ArrowUp:qaxis([1,0,0],Math.PI/2),ArrowDown:qaxis([1,0,0],-Math.PI/2),ArrowLeft:qaxis([0,1,0],-Math.PI/2),ArrowRight:qaxis([0,1,0],Math.PI/2)}[e.key];if(!rot)return;e.preventDefault();soundInit();if(anim)liveQ=anim.to;anim={from:liveQ.slice(),to:qnorm(qmul(rot,liveQ)),begin:performance.now(),duration:210};tone(660,.016,.06);requestDraw()});
$('next').onclick=()=>{stage=(stage+1)%specs.length;storage.setItem('acorn_shadow_level',stage);configure();tone(660,.019,.06)};$('reset').onclick=()=>{soundInit();configure();tone(630,.018,.06)};$('sound').onclick=()=>{soundOn=!soundOn;storage.setItem('acorn_shadow_sound',soundOn?'on':'off');updateSound();if(soundOn)tone(740,.025,.07)};function updateSound(){$('soundsvg').innerHTML=soundOn?'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>':'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/>'}
window.addEventListener('resize',requestDraw);if('ResizeObserver'in window)new ResizeObserver(requestDraw).observe(hero);stage=clamp(+(storage.getItem('acorn_shadow_level')||0),0,specs.length-1);updateSound();configure();
